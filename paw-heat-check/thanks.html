<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the paw alert list · Paw Heat Check</title>
<style>
:root{--bg:#fbf6ef;--ink:#2a1d14;--muted:#7a6656;--accent:#f26a1b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1a130e;--ink:#f6ebe0;--muted:#bba796;--accent:#ff8a45;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
h1{font-family:Georgia,serif;font-size:34px;margin:0 0 10px}
p{color:var(--muted);max-width:420px;margin:0 auto 20px}
a{display:inline-block;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;padding:12px 18px;border-radius:12px}
</style>
</head>
<body>
<div>
  <div style="font-size:48px" aria-hidden="true">🐾</div>
  <h1>You're on the list</h1>
  <p>We'll email you the evening before a day when footpaths in your suburb get too hot for paws.</p>
  <a href="/">Back to Paw Heat Check</a>
</div>
</body>
</html>
